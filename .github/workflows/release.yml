name: Release Package Build

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: tado_local

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          CFG=$(grep -oP '^version:\s*"\K[^"]+' tado_local/config.yaml)
          echo "tag=$VERSION  config.yaml=$CFG"
          if [ "$VERSION" != "$CFG" ]; then
            echo "::error::config.yaml version ($CFG) != git tag ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./tado_local
          platforms: ${{ matrix.platform }}
          provenance: false
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}_${{ matrix.arch }}:${{ needs.check-version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}_${{ matrix.arch }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-python:3.14-alpine3.23
      - name: Verify the pushed manifest is pullable
        run: |
          docker pull ghcr.io/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}_${{ matrix.arch }}:${{ needs.check-version.outputs.version }}

  release:
    needs: [check-version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(needs.check-version.outputs.version, 'alpha') || contains(needs.check-version.outputs.version, 'beta') || contains(needs.check-version.outputs.version, 'rc') }}
          body: |
            Images:
            - `ghcr.io/${{ github.repository_owner }}/tado_local_amd64:${{ needs.check-version.outputs.version }}`
            - `ghcr.io/${{ github.repository_owner }}/tado_local_aarch64:${{ needs.check-version.outputs.version }}`
